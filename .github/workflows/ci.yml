name: ci

on:
  push:
  pull_request:

jobs:
  # Fast, platform-neutral gates. These run on Linux because nothing in them
  # touches macOS, so they stay cheap and quick to give feedback on.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # The platform-neutral half of the end-to-end suite. It drives the real
      # relayd but never touches a stored credential, so it runs anywhere.
      - name: e2e (platform-neutral half)
        run: bash scripts/e2e/core.sh

  # The macOS-only half: the checks that read and write the Keychain and the
  # session store. relayd does that through /usr/bin/security, the macOS
  # Keychain CLI, which does not exist on Linux, so this half can only run
  # here. Relay is macOS-first by design (Keychain, LaunchAgent, security(1)).
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Runs core.sh unconditionally and macos.sh on Darwin, then reports one
      # aggregate count.
      - name: e2e
        run: bash scripts/e2e.sh
