# Local filesystem capabilities — the "Relay is not an API wrapper" example
# (spec 46). This manifest describes a local capability rather than a remote
# API, which is the point: the tool/daemon/skill model does not assume HTTP.
#
# Relay executes it through the LocalExecutor. Each operation's request block
# names the local primitive to run in request.operation; a local request has no
# method, path, or baseUrl, because it contacts no service.
#
# Access is bounded by the declared permissions.filesystem scopes below. Before
# an operation runs, the daemon resolves the path it names — expanding ~ and
# following symlinks — and refuses the call unless a declared scope contains the
# resolved path (spec 24, 25, 40).
apiVersion: relay/v1
kind: Tool
metadata:
  name: filesystem
  version: 0.2.0
  description: Local filesystem capabilities — read, write, list, and stat

runtime:
  name: relay
  apiVersion: v1

protocol:
  type: local

# No auth block: a local capability has no remote credential. Access is bounded
# by the declared filesystem permissions below (spec 25, 46).

capabilities:
  - filesystem.read
  - filesystem.write

permissions:
  filesystem:
    read:
      - "~/Documents"
      - "~/Desktop"
    write:
      - "~/Documents"

tools:
  - name: read_file
    description: Read the contents of a single file
    input:
      type: object
      properties:
        path:
          type: string
          description: Absolute path or ~-relative path to the file
        encoding:
          type: string
          description: How to return the bytes; base64 for binary content
          enum:
            - utf-8
            - base64
          default: utf-8
      required:
        - path
    request:
      operation: read_file

  - name: write_file
    description: Write content to a file, creating or overwriting it
    input:
      type: object
      properties:
        path:
          type: string
          description: Absolute path or ~-relative path to the file
        content:
          type: string
          description: Content to write
        encoding:
          type: string
          description: How to interpret content; base64 for binary payloads
          enum:
            - utf-8
            - base64
          default: utf-8
        create_dirs:
          type: boolean
          description: Create missing parent directories
          default: false
      required:
        - path
        - content
    request:
      operation: write_file

  - name: list_directory
    description: List the entries of a directory
    input:
      type: object
      properties:
        path:
          type: string
          description: Absolute path or ~-relative path to the directory
        recursive:
          type: boolean
          description: Descend into subdirectories
          default: false
        pattern:
          type: string
          description: Optional glob filter applied to entry names, e.g. *.md
      required:
        - path
    request:
      operation: list_directory

  - name: stat
    description: Report metadata for a path without reading its content
    input:
      type: object
      properties:
        path:
          type: string
          description: Absolute path or ~-relative path to inspect
      required:
        - path
    request:
      operation: stat
